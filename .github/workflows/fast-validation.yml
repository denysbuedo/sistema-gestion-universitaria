name: Fast validation

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: fast-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, gd, intl, mbstring, pgsql, sodium, xml, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          cp .env.example .env
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Validate PHP syntax
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null || failed=1
          done < <(find src config migrations tests -type f -name '*.php' -print0)
          exit "$failed"

      - name: Prepare test keys
        run: php bin/console lexik:jwt:generate-keypair --env=test --skip-if-exists

      - name: Run fast tests
        env:
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: php vendor/bin/phpunit tests/Unit --no-coverage --do-not-cache-result

      - name: Validate Symfony configuration
        run: |
          php bin/console lint:container --env=test
          php bin/console lint:yaml config
          php bin/console lint:twig templates

      - name: Audit dependencies
        run: composer audit --locked --abandoned=report
