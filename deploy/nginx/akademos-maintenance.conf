server {
    listen 8080;
    listen [::]:8080;
    server_name sgu.mes.gob.cu;

    set_real_ip_from 10.46.4.22;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        default_type text/plain;
        add_header Retry-After 300 always;
        return 503 "SGU en preparacion\n";
    }

    access_log /var/log/nginx/akademos.access.log;
    error_log /var/log/nginx/akademos.error.log;
}
