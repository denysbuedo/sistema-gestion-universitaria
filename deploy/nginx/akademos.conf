server {
    listen 8080;
    listen [::]:8080;
    server_name sgu.mes.gob.cu;

    set_real_ip_from 10.46.4.22;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /var/www/akademos/current/public;
    index index.php;

    client_max_body_size 32m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~* ^/(?:assets|build)/.+\.(?:css|js|gif|jpe?g|png|svg|webp|ico|woff2?|ttf|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm-akademos.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/akademos.access.log akademos_timing;
    error_log /var/log/nginx/akademos.error.log;
}
