security:
    password_hashers:
        App\Entity\Security\User:
            algorithm: auto


    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            id: App\Repository\Security\UserRepository
        # used to reload user from session & other features (e.g. switch_user)
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern:  ^/api/login
            stateless: true
            user_checker: App\Security\ActiveUserChecker
            json_login:
                check_path:               /api/login_check
                success_handler:          lexik_jwt_authentication.handler.authentication_success
                failure_handler:          lexik_jwt_authentication.handler.authentication_failure
                username_path: email
                password_path: password
                provider: app_user_provider


        api:
            pattern:   ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\ActiveUserChecker
            jwt: ~


        main:
            provider: app_user_provider
            user_checker: App\Security\ActiveUserChecker
            custom_authenticators:
                - App\Security\OidcAuthenticator
                - App\Security\LoginFormAuthenticator
            entry_point: App\Security\LoginFormAuthenticator
            logout:
                path: app_logout

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # - { path: ^/profile, roles: ROLE_USER } IS_AUTHENTICATED_FULLY
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/oidc/(login|check), roles: PUBLIC_ACCESS }
        - { path: ^/api,       roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }
        # - { path: ^/admin, roles: [ROLE_ADMIN] }
        #- { path: ^/, roles: IS_AUTHENTICATED_FULLY }
